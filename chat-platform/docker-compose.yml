services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_app
      POSTGRES_USER: chat_app
      POSTGRES_PASSWORD: chat_demo_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chat-platform-postgres:/var/lib/postgresql/data

volumes:
  chat-platform-postgres:
