spring.application.name=chat-platform-server
server.port=${PORT:8080}
spring.datasource.url=${CHAT_DB_URL:jdbc:postgresql://localhost:5432/chat_app}
spring.datasource.username=${CHAT_DB_USER:chat_app}
spring.datasource.password=${CHAT_DB_PASSWORD:chat_demo_password}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.upload-dir=${CHAT_UPLOAD_DIR:uploads}
app.demo-data=${CHAT_DEMO_DATA:false}
